<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Cadastro Loja
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html">Cadastro</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="lista.html">Lista</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

    <div class="container mt-5">

        <h1 class="mb-4">Lista de Produtos</h1>

        <!-- Campo de busca -->
        <input
            type="text"
            id="busca"
            class="form-control mb-4"
            placeholder="Pesquisar produto pelo nome">

        <!-- Cards de resumo -->
        <div class="row mb-4">

            <div class="col-md-4">
                <div class="card text-center p-3 shadow">
                    <h5>Total de Produtos</h5>
                    <h3 id="totalProdutos">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center p-3 shadow">
                    <h5>Produtos Ativos</h5>
                    <h3 id="produtosAtivos">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center p-3 shadow">
                    <h5>Valor do Estoque</h5>
                    <h3 id="valorEstoque">R$ 0,00</h3>
                </div>
            </div>

        </div>

        <!-- Lista de produtos -->
        <div id="listaProdutos" class="row"></div>

    </div>

    <script src="js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
